databases:
  - name: college-fees-db
    databaseName: college_erp
    user: college_admin
    plan: free
    region: oregon

services:
  - type: web
    name: college-fees-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: college-fees-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
